name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Run tests
        run: dotnet test --no-build -c Release
      - name: Run smoke recording (best-effort)
        shell: pwsh
        run: |
          # Ensure required helper assemblies are available in tools/
          .\scripts\fetch_tools.ps1 -Packages @("Microsoft.Diagnostics.Tracing.TraceEvent:3.0.0","Microsoft.Diagnostics.Symbols:1.0.0")
          # Copy tool DLLs into the build output so reflection-based probes can find them
          .\scripts\copy_tools_to_app.ps1 -Configuration Release -Framework net10.0
          # Attempt to run the repository smoke script; it may require privileges for diagnostics
          .\scripts\record_and_postprocess.ps1 -Duration 5 -SessionPrefix ci-smoke
